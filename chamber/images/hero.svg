<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-label="Lagos skyline at dusk, silhouetted against a warm sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B4F4A"/>
      <stop offset="55%" stop-color="#1B6B63"/>
      <stop offset="100%" stop-color="#E0A527"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#083B37"/>
      <stop offset="100%" stop-color="#0B4F4A"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="700" fill="url(#sky)"/>
  <circle cx="1230" cy="330" r="120" fill="#F7F4EC" opacity="0.9"/>
  <rect x="0" y="520" width="1600" height="180" fill="url(#water)"/>
  <!-- skyline silhouette -->
  <g fill="#06302C">
    <rect x="60"  y="380" width="70"  height="160"/>
    <rect x="150" y="320" width="55"  height="220"/>
    <rect x="220" y="410" width="90"  height="130"/>
    <rect x="330" y="260" width="60"  height="280"/>
    <rect x="410" y="350" width="80"  height="190"/>
    <rect x="510" y="300" width="50"  height="240"/>
    <rect x="580" y="230" width="65"  height="310"/>
    <rect x="665" y="370" width="95"  height="170"/>
    <rect x="780" y="200" width="70"  height="340"/>
    <rect x="870" y="330" width="60"  height="210"/>
    <rect x="950" y="280" width="85"  height="260"/>
    <rect x="1060" y="390" width="70" height="150"/>
    <rect x="1150" y="250" width="55" height="290"/>
    <rect x="1230" y="360" width="90" height="180"/>
    <rect x="1340" y="300" width="60" height="240"/>
    <rect x="1420" y="400" width="100" height="140"/>
    <rect x="1530" y="330" width="55" height="210"/>
  </g>
  <g fill="#E0A527" opacity="0.85">
    <rect x="335" y="270" width="8" height="8"/>
    <rect x="355" y="300" width="8" height="8"/>
    <rect x="590" y="250" width="8" height="8"/>
    <rect x="610" y="290" width="8" height="8"/>
    <rect x="790" y="230" width="8" height="8"/>
    <rect x="815" y="270" width="8" height="8"/>
    <rect x="960" y="310" width="8" height="8"/>
    <rect x="1160" y="280" width="8" height="8"/>
    <rect x="1430" y="430" width="8" height="8"/>
